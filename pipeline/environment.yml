name: pipeline
channels:
  - conda-forge
  - pytorch
  - huggingface
  - defaults

dependencies:
  # Python version
  - python=3.10

  # Core scientific computing (used in main.py for visualization)
  - numpy>=1.26.4
  - scikit-learn>=1.6.1
  - matplotlib>=3.10.1
  - seaborn>=0.13.2

  # Deep learning and ML (for sentence transformers and TSNE)
  - pytorch>=2.0.0
  - sentence-transformers
  - datasets>=3.1.0
  # LLM and API clients (for LLM judge filtering)
  - openai>=1.54.4
  - python-dotenv>=1.0.0

  # Data processing and utilities
  - tqdm>=4.67.0
  - pydantic>=2.0.0

  # Standard library extensions
  - pathlib2

  # Pip dependencies (packages not available in conda)
  - pip
